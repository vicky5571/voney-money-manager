<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded App Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner glowing circles for depth -->
  <circle cx="420" cy="100" r="140" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="90" cy="420" r="120" fill="#ffffff" fill-opacity="0.04" />

  <!-- Front Accent Card with Shadow -->
  <rect x="96" y="160" width="320" height="200" rx="32" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Card Magnetic Strip & Chip -->
  <rect x="136" y="200" width="48" height="36" rx="8" fill="#FDE047" />
  <circle cx="360" cy="260" r="28" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="330" cy="260" r="28" fill="#ffffff" fill-opacity="0.3" />

  <!-- "V" for Voney Logo Monogram in White -->
  <path d="M 216 280 L 256 340 L 296 280" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dollar sparkle accent -->
  <path d="M 256 110 L 262 126 L 278 132 L 262 138 L 256 154 L 250 138 L 234 132 L 250 126 Z" fill="#FBBF24" />
</svg>
